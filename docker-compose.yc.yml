version: '3.8'

services:
  app:
    build: .
    ports:
      - "3022:3022"
    # extra_hosts:
    #   - "database:178.154.241.202"
    networks:
      - main-network
    environment:
      - GOPATH=/go
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=localhost
      - NODE_APP_PORT=${NODE_APP_PORT}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - HOST_IP=${HOST_IP}
