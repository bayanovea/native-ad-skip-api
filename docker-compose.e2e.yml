version: '3.8'

services:
  e2e-db:
    image: postgres:15
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      - e2e-network

  e2e-app:
    build:
      context: .
      args:
        EXTRA_PACKAGES: postgresql-client   # psql for test/review-export.test.js (prod image stays without it)
    depends_on:
      e2e-db:
        condition: service_healthy
    environment:
      DB_HOST: e2e-db
      DB_NAME: app
      DB_USER: app_user
      DB_PASSWORD: app_pass
      NODE_APP_PORT: 3022
      AUTH_TOKEN: test_token
      GOPATH: /go
      APP_DIR: /app
      # ai detect: canned yt-dlp and model answers (test/fixtures/ai); test/e2e.js turns AI_DETECT_ENABLED on per run
      YTDLP_BIN: /app/test/fixtures/ai/yt-dlp-stub.sh
      AI_CLIENT: fixture
      AI_FIXTURE_DIR: /app/test/fixtures/ai
      # One tick claims every queued test video, with no pause between fetches
      AI_BATCH_MAX: "100"
      AI_FETCH_PAUSE: "0"
      # The video platform under test: placeholder URL templates; an earlier prefix for the rename one-off and the API alias
      PROVIDER_VIDEO_URL: https://example.invalid/video{id}
      PROVIDER_LINK_AT: https://example.invalid/video{id}?t={t}
      LEGACY_PRV: old
    command: node --test test/e2e.js test/moderation-resolver.test.js test/review-export.test.js test/legacy-rename.test.js
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
