version: '3.8'

services:
  app:
    build: .
    ports:
      - "3022:3022"
    env_file: 
      - .env
    environment:
      - GOPATH=/go
  prometheus:
    image: prom/prometheus:v2.45.2
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.dev.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/data
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
volumes:
  prometheus_data:
