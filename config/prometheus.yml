global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'native-ad-skip-api'
    static_configs:
      - targets: ['app:3022']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Probes go out through the public DNS name, nginx and TLS, unlike the app job.
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://${API_HOST}/
          - https://${LANDING_HOST}/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
