# Installed at /etc/nginx/sites-available/api.conf on the prod host.
# Needs the `redacted` log_format from redacted-log-format.conf (conf.d/).
# Bootstrap and reload steps: infrastructure/nginx/README.md

server {
    listen 80;
    server_name ${API_HOST};

    # a plain-http request with ?verifyBearerToken= lands here before the redirect
    access_log /var/log/nginx/access.log redacted;

    # certbot renewals use the webroot authenticator
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) predates the standalone `http2 on;` directive
    listen 443 ssl http2;
    server_name ${API_HOST};

    # `redacted` (conf.d/redacted-log-format.conf) keeps AUTH_TOKEN out of the
    # log; a server-level access_log replaces the http-level one from nginx.conf
    access_log /var/log/nginx/access.log redacted;

    ssl_certificate     /etc/letsencrypt/live/${API_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${API_HOST}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # events batches and markups are small JSON bodies
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite, not append: server.js sets `trust proxy = true`, so a
        # client-supplied X-Forwarded-For would otherwise become req.ip
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
