# Installed at /etc/nginx/conf.d/redacted-log-format.conf on the prod host
# (http context; nginx.conf includes conf.d/*.conf before sites-enabled/*).
# Steps: infrastructure/nginx/README.md
#
# `combined` minus the secrets: admin pages carry AUTH_TOKEN as
# ?verifyBearerToken=…, so `$request` (full URI) is replaced by `$uri` (no
# query string), and `$http_referer` is dropped because the referer of the
# requests those pages make carries the token too. Only the format lives here:
# an access_log at http level would add a second log next to nginx.conf's,
# so api.conf selects this format per server instead.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent"';
