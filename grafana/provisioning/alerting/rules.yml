# Evaluated every minute against the Prometheus datasource (StaleMarkups: the
# Postgres one); uids from datasources/datasources.yml. The contact point `telegram` is rendered by
# Compose into this directory (docker-compose.yml `configs:`). Annotations are
# not run through Grafana's `$VAR` expansion, so `{{ $labels.provider }}` is
# written as is.
apiVersion: 1

# File provisioning never removes a rule that merely disappeared from `groups`;
# a dropped rule stays (and keeps firing) until it is listed here.
deleteRules:
  - orgId: 1
    uid: lookup-not-found-share   # dropped 2026-10-19: not_found is 95% of normal traffic

groups:
  - orgId: 1
    name: api
    folder: native-ad-skip-api
    interval: 1m
    rules:
      # No series at all means the calculator never ran (or /metrics has no
      # heartbeat): that is the alert, hence noDataState Alerting. A is the age of
      # the last success over the provider's limit (prv/rt/yt 10 min, ai_detect
      # 15 min, ai_judge 2 h), so one threshold of 1 serves all; a switched-off AI
      # command deletes its row, so it has no series here.
      - uid: calculator-stale
        title: CalculatorStale
        condition: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: 'calculator {{ $labels.provider }}: no successful run within its limit (prv/rt/yt 10 min, ai_detect 15 min, ai_judge 2 h)'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: c62ca5db-1b9b-4b36-a035-145154b708ae
            model:
              refId: A
              expr: >-
                (time() - max by (provider) (calculator_last_success_timestamp_seconds{provider!~"ai_.*"})) / 600
                or (time() - max by (provider) (calculator_last_success_timestamp_seconds{provider="ai_detect"})) / 900
                or (time() - max by (provider) (calculator_last_success_timestamp_seconds{provider="ai_judge"})) / 7200
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
      - uid: http-5xx
        title: Http5xx
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'more than 5 HTTP 5xx in 5 min'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: c62ca5db-1b9b-4b36-a035-145154b708ae
            model:
              refId: A
              expr: sum(increase(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
      # Queried as plain `up` with a < 1 threshold rather than `up == 0`: the
      # filtered form is empty while healthy, and no data here must alert
      # (Prometheus not scraping the app at all is also an outage).
      - uid: api-down
        title: ApiDown
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: 'API is down: Prometheus cannot scrape app:3022'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: c62ca5db-1b9b-4b36-a035-145154b708ae
            model:
              refId: A
              expr: up{job="native-ad-skip-api"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      # The histogram's top bucket is 2.5 s, so the quantile saturates there;
      # fine for a 1 s threshold.
      - uid: http-latency-p95
        title: HttpLatencyP95
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'HTTP p95 latency over 1 s for 5 min'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: c62ca5db-1b9b-4b36-a035-145154b708ae
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
      # 3m = three one-minute cron runs in a row with the same video failing.
      - uid: calculator-failed-videos
        title: CalculatorFailedVideos
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'calculator {{ $labels.provider }}: a video fails on every run, look for "Calculate video failed: <video_id>" in docker logs (ai_detect: "ai detect:" lines; "every fetch of the tick failed" = prv may be refusing the host, set AI_DETECT_ENABLED=off)'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: c62ca5db-1b9b-4b36-a035-145154b708ae
            model:
              refId: A
              expr: max by (provider) (calculator_failed_videos)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      # prv only (`markups`); rt/yt have no data. Every writer that sets
      # is_new = true goes through Sequelize, which bumps "updatedAt".
      - uid: stale-markups
        title: StaleMarkups
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $values.A }} markups with is_new for over 10 min: the calculator is skipping a locked row or not running'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ce68e9be-35fa-4d6a-8f59-35f03dae1d52
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT COUNT(*) AS stale FROM markups
                WHERE is_new = true AND deleted_at IS NULL
                  AND "updatedAt" < NOW() - INTERVAL '10 minutes'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      # 10 = AI_DAILY_BUDGET_VIDEOS (default 200) × $0.05: the daily budget's cost
      # ($0.025 a video) twice over. Grafana cannot read the env: change it with the budget.
      - uid: ai-cost-daily
        title: AiCostDaily
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'AI spent {{ $values.A }} USD in 24 h, over twice the daily budget: check prv_ai_runs / prv_ai_judgements, AI_DETECT_ENABLED=off stops it'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: c62ca5db-1b9b-4b36-a035-145154b708ae
            model:
              refId: A
              expr: sum(ai_cost_usd_24h)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
