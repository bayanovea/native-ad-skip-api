version: '3.8'

services:
  app:
    build: .
    ports:
      - "127.0.0.1:3022:3022"
    extra_hosts:
      - "database:178.154.241.202"
    networks:
      - main-network
    environment:
      - GOPATH=/go
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=178.154.241.202
      - NODE_APP_PORT=${NODE_APP_PORT}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - HOST_IP=${HOST_IP}
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - main-network
    volumes:
      - ./api/doc/openapi.yaml:/usr/share/nginx/html/openapi.yaml
    environment:
      - SWAGGER_JSON=/usr/share/nginx/html/openapi.yaml
