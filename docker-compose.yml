version: '3.8'

services:
  app:
    build: .
    ports:
      - "3022:3022"
    extra_hosts:
      - "database:134.122.73.229"
    environment:
      - GOPATH=/go
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - NODE_APP_PORT=${NODE_APP_PORT}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - HOST_IP=${HOST_IP}
  prometheus:
    image: prom/prometheus:v2.45.2
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - native-ad-skip-api_prometheus_data:/data
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
volumes:
  prometheus_data:
