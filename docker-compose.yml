x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    # Prod pulls the image CI pushed (IMAGE_TAG = commit sha, see .github/workflows/deploy.yml);
    # 'build:' stays so a local 'docker compose up --build' still builds it under the same name.
    image: ghcr.io/bayanovea/native-ad-skip-api:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3022:3022"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - main-network
    environment:
      - GOPATH=/go
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - NODE_APP_PORT=${NODE_APP_PORT}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - HOST_IP=${HOST_IP}
      # AI detection and judge (prv/commands/ai) and AI-first serving (Node): off unless the deploy env turns them on
      - AI_FIRST=${AI_FIRST:-off}
      - AI_DETECT_ENABLED=${AI_DETECT_ENABLED:-off}
      - AI_JUDGE_ENABLED=${AI_JUDGE_ENABLED:-off}
      - AI_JUDGE_AUTO_WITHDRAW=${AI_JUDGE_AUTO_WITHDRAW:-on}
      - AI_JUDGE_MODEL=${AI_JUDGE_MODEL:-}
      - AI_JUDGE_MIN_INTERVAL=${AI_JUDGE_MIN_INTERVAL:-}
      - AI_MIN_VIEWS=${AI_MIN_VIEWS:-}
      - AI_MIN_REQUESTS=${AI_MIN_REQUESTS:-}
      - AI_DAILY_BUDGET_VIDEOS=${AI_DAILY_BUDGET_VIDEOS:-}
      - AI_MIN_SEGMENT_SECONDS=${AI_MIN_SEGMENT_SECONDS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
  prometheus:
    image: prom/prometheus:v2.45.2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - main-network
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *default-logging
    pid: host
    networks:
      - main-network
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    logging: *default-logging
    networks:
      - main-network
    volumes:
      - ./config/blackbox.yml:/etc/blackbox_exporter/config.yml

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3024:3024"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    networks:
      - main-network
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_HTTP_PORT=3024
      - GF_SERVER_ROOT_URL=http://${HOST_IP}:3024/   # links in Telegram alerts; default is localhost
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    configs:
      - source: grafana-contact-points
        target: /etc/grafana/provisioning/alerting/contact-points.yml

configs:
  # Rendered by Compose (needs 2.23.1+), not by Grafana's own `$VAR` expansion:
  # Grafana turns an env var that parses as a number into a YAML number, and
  # the Telegram integration requires `chatid` to be a string (Grafana 12.3.1
  # then refuses to start). The two values come from the deploy environment
  # (GitHub Actions secrets); rules and policies live in grafana/provisioning/alerting/.
  grafana-contact-points:
    content: |
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: telegram
          receivers:
            - uid: telegram
              type: telegram
              settings:
                bottoken: "${TELEGRAM_BOT_TOKEN}"
                chatid: "${TELEGRAM_CHAT_ID}"
              disableResolveMessage: false

volumes:
  prometheus_data:
  grafana_data:

networks:
  main-network:
    external: true
    driver: bridge
