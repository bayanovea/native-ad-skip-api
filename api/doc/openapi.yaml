openapi: 3.0.3
info:
  title: native-ad-skip-api
  version: 1.0.0
  description: |
    Crowdsourced video ad/segment skipping API.
    Supports three video platforms: **prv**, the main one (no prefix), **rt** (`/rt`), **yt** (`/yt`).

servers:
  - url: http://localhost:3022

# ── Security ──────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: "Username: `admin` — Password: `AUTH_TOKEN` value"
    tokenQuery:
      type: apiKey
      in: query
      name: verifyBearerToken
      description: "AUTH_TOKEN value as query parameter. Used by Grafana-compatible GET endpoints."

  schemas:
    ReviewLockRequest:
      type: object
      required: [reviewer]
      properties:
        reviewer: { type: string, description: "A registered reviewer code" }
        force:    { type: boolean, description: "release only: clear another reviewer's lock" }
    ReviewLock:
      type: object
      properties:
        batch:     { type: string }
        locked_by: { type: string, nullable: true }
        locked_at: { type: string, format: date-time, nullable: true }
    Segment:
      type: object
      description: |
        Aggregated segment served from `video_calculateds.data`, or (prv, `AI_FIRST=on`, the video
        has an active AI row) from `prv_ai_video_calculateds.data`, whose entries also carry
        `confidence` and `source: "ai"` (`"review"` once an assessor set its bounds). `rating` is the sum of the users' latest votes on the
        segment, omitted when 0.
      properties:
        category_id: { type: integer, example: 1 }
        start:       { type: integer, example: 5 }
        end:         { type: integer, example: 30 }
        rating:      { type: integer, example: 0 }
        confidence:  { type: string, example: high, description: "AI entries only" }
        source:      { type: string, enum: [ai, review], description: "AI entries only; `review` once an assessor set the entry's bounds" }

    Interval:
      type: object
      required: [start, end]
      description: |
        Seconds, stored rounded to whole seconds. A non-blank numeric string is also accepted.
        After rounding, `0 <= start < end <= 86400`, otherwise 400.
      properties:
        start: { type: number, minimum: 0, example: 5.0 }
        end:   { type: number, maximum: 86400, example: 30.0 }

    # ── prv schemas (duration optional) ───────────────────────────────────────
    PrvMarkupBody:
      type: object
      required: [video_id, user_id, category_id, data]
      properties:
        video_id:    { type: string, example: "123_456" }
        user_id:     { type: string, example: "uuid-abc" }
        prv_user_id:  { type: integer, minimum: 1, nullable: true, example: 789 }
        category_id: { type: integer, minimum: 1, example: 1 }
        v:
          type: string
          example: "1"
          description: "Version string. If omitted, legacy mode activates and `-` is prepended to video_id."
        data:
          type: object
          required: [intervals]
          properties:
            intervals:
              type: array
              minItems: 1
              maxItems: 20
              items: { $ref: '#/components/schemas/Interval' }
        duration: { type: integer, minimum: 1, nullable: true, example: 300 }

    PrvUpdateMarkupBody:
      type: object
      required: [video_id, user_id, category_id, start, end]
      properties:
        video_id:       { type: string }
        user_id:        { type: string }
        prv_user_id:     { type: integer, minimum: 1 }
        category_id:    { type: integer, minimum: 1 }
        start:          { type: integer, minimum: 0 }
        end:            { type: integer, minimum: 0 }
        new_category_id: { type: integer, minimum: 1 }
        new_start:       { type: integer, minimum: 0 }
        new_end:         { type: integer, minimum: 0 }
        duration:        { type: integer, minimum: 1, nullable: true }

    PrvVoteBody:
      type: object
      required: [video_id, user_id, category_id, start, end, vote]
      properties:
        video_id:    { type: string }
        user_id:     { type: string }
        prv_user_id:  { type: integer, minimum: 1, nullable: true }
        category_id: { type: integer, minimum: 1 }
        start:       { type: integer, minimum: 0 }
        end:         { type: integer, minimum: 0 }
        vote:        { type: integer, minimum: -1, maximum: 1, example: 1 }
        duration:    { type: integer, minimum: 1, nullable: true }

    # ── RT/YT schemas (duration required, prv_user_id required in vote) ───────
    RTMarkupBody:
      type: object
      required: [video_id, user_id, category_id, data, duration]
      properties:
        video_id:    { type: string }
        user_id:     { type: string }
        prv_user_id:  { type: integer, minimum: 1, nullable: true }
        category_id: { type: integer, minimum: 1 }
        data:
          type: object
          required: [intervals]
          properties:
            intervals:
              type: array
              minItems: 1
              maxItems: 20
              items: { $ref: '#/components/schemas/Interval' }
        duration: { type: integer, minimum: 1, example: 300 }

    RTUpdateMarkupBody:
      type: object
      required: [video_id, user_id, category_id, start, end, duration]
      properties:
        video_id:       { type: string }
        user_id:        { type: string }
        prv_user_id:     { type: integer, minimum: 1 }
        category_id:    { type: integer, minimum: 1 }
        start:          { type: integer, minimum: 0 }
        end:            { type: integer, minimum: 0 }
        new_category_id: { type: integer, minimum: 1 }
        new_start:       { type: integer, minimum: 0 }
        new_end:         { type: integer, minimum: 0 }
        duration:        { type: integer, minimum: 1 }

    RTVoteBody:
      type: object
      required: [video_id, user_id, prv_user_id, category_id, start, end, vote, duration]
      properties:
        video_id:    { type: string }
        user_id:     { type: string }
        prv_user_id:  { type: integer, minimum: 1 }
        category_id: { type: integer, minimum: 1 }
        start:       { type: integer, minimum: 0 }
        end:         { type: integer, minimum: 0 }
        vote:        { type: integer, minimum: -1, maximum: 1 }
        duration:    { type: integer, minimum: 1 }

    EventIntervalUndo:
      type: object
      required: [type, user_id, video_native_id, category_id, start, end]
      properties:
        type:            { type: string, enum: [interval_undo] }
        user_id:         { type: string, example: "uuid-abc" }
        prv_user_id:      { type: integer, minimum: 1, nullable: true }
        video_native_id: { type: string, example: "123_456" }
        category_id:     { type: integer, minimum: 1 }
        start:           { type: integer, minimum: 0 }
        end:             { type: integer, minimum: 0 }

    EventIntervalClick:
      type: object
      required: [type, user_id, video_native_id, category_id, start, end, click_time]
      properties:
        type:            { type: string, enum: [interval_click] }
        user_id:         { type: string }
        prv_user_id:      { type: integer, minimum: 1, nullable: true }
        video_native_id: { type: string }
        category_id:     { type: integer, minimum: 1 }
        start:           { type: integer, minimum: 0 }
        end:             { type: integer, minimum: 0 }
        click_time:      { type: integer, description: "Seconds into the video when clicked" }

    EventClientFailed:
      type: object
      required: [type, user_id, video_native_id, reason]
      properties:
        type:            { type: string, enum: [client_failed] }
        user_id:         { type: string }
        prv_user_id:      { type: integer, minimum: 1, nullable: true }
        video_native_id: { type: string }
        reason:          { type: string }
        data:            { type: object, nullable: true, additionalProperties: true }

    EventTimeSaved:
      type: object
      required: [type, user_id]
      properties:
        type:       { type: string, enum: [time_saved] }
        user_id:    { type: string }
        prv_user_id: { type: integer, minimum: 1, nullable: true }
        inc:        { type: integer, minimum: 0, nullable: true, description: "Seconds to add to time_saved" }

    EventsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            time_saved:
              type: object
              description: "Present only when the batch contains at least one time_saved event"
              properties:
                by_user_id:    { type: integer, description: "Total time saved across all records for this generated_user_id" }
                by_prv_user_id: { type: integer, description: "Total time saved across all records for this prv_user_id" }
                by_user:       { type: integer, description: "time_saved on the matched user record" }

  responses:
    Unauthorized:
      description: Unauthorized
    NotFound:
      description: Not found
    ValidationError:
      description: Validation error

# ── Tags ──────────────────────────────────────────────────────────────────────
tags:
  - name: System
  - name: prv
  - name: RT
  - name: YT
  - name: Admin

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:

  # ── System ──────────────────────────────────────────────────────────────────
  /:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200': { description: OK }

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema: { type: string }

  # ── prv ──────────────────────────────────────────────────────────────────────
  /video-calculated:
    get:
      tags: [prv]
      summary: Get calculated segments
      parameters:
        - name: video_id
          in: query
          required: true
          schema: { type: string }
        - name: v
          in: query
          schema: { type: string }
          description: "Version string. Required for correct lookup; omit only for legacy clients."
        - name: duration
          in: query
          schema: { type: integer }
        - name: views_text
          in: query
          schema: { type: string, maxLength: 128 }
          description: "The video's view counter as the platform's page shows it (`39,4 тыс просмотров`, `1.7M views`); whitespace collapsed, anything after `·` dropped. Optional; never a 400 (longer strings are cut to 128). With `v` present each request is counted per `video_id` for the AI detection queue after the response is sent; the server reads the count out of it (max kept) and keeps the latest string. Ignored without `v`."
        - name: user_id
          in: query
          schema: { type: string }
        - name: prv_user_id
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Calculated segments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Segment' }
        '204': { description: No calculated data for this video }

  /markup:
    post:
      tags: [prv]
      summary: Submit a markup
      description: |
        Users with rating ≤ −2 or a hard ban are silently accepted (201 returned) but the markup is not stored.
        The markup and all its intervals are stored in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrvMarkupBody' }
      responses:
        '201': { description: Created }
        '400': { description: "Validation error, e.g. `data.intervals` empty or over 20 items, a missing or non-numeric `start`/`end`, or an interval outside `0 <= start < end <= 86400` after rounding" }

  /markups:
    get:
      tags: [prv]
      summary: List markups
      security:
        - basicAuth: []
      responses:
        '200':
          description: Markups list
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [prv]
      summary: Update a markup interval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrvUpdateMarkupBody' }
      responses:
        '200': { description: Updated }
        '400': { description: "New category is invalid, or the resulting interval breaks the POST /markup rules (0 <= start < end <= 86400)" }
        '404': { $ref: '#/components/responses/NotFound' }

  /markups/{id}:
    delete:
      tags: [prv]
      summary: Soft-delete a markup
      security:
        - basicAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /markups/{id}/delete:
    get:
      tags: [prv]
      summary: Soft-delete a markup (Grafana-compatible)
      security:
        - tokenQuery: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /videos/{id}/markups:
    delete:
      tags: [prv]
      summary: Hard-delete all markups for a video
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "Video DB id (integer) or native_id (string)"
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vote:
    post:
      tags: [prv]
      summary: Submit a vote on a calculated segment
      description: |
        Replaces the user's previous vote on the segment (the same value again changes nothing)
        and recomputes the segment's
        `rating` (in `prv_calculated_segments` and the matching `video_calculateds.data` entry,
        omitted there when 0) from the votes table: the sum of each user's latest vote on the
        exact `(category_id, start, end)`. With `AI_FIRST=on`, an active AI row and a `duration`
        (the segments GET serves on a `match` / `backfilled` lookup), the segment comes from the
        AI row's `data` and a segment it does not serve is 404. A vote belongs to the interval
        whatever source served it: every vote recomputes the AI row's matching entry and the
        human segment with the same bounds. Also adjusts by the diff between the new and the
        previous vote the user `rating` of every author whose markup has an interval with the
        exact `(start, end)`, on either path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrvVoteBody' }
      responses:
        '204': { description: Vote recorded }
        '404': { description: Video, calculated data, or segment not found }

  /votes/{id}/delete:
    get:
      tags: [prv]
      summary: Delete a vote (Grafana-compatible)
      description: |
        Undoes the vote: deletes it, recomputes the segment's `rating` from the remaining
        votes (`prv_calculated_segments`, `video_calculateds.data` and the matching entry of the
        video's AI row in any state) and reverses the change the vote made to the markup authors'
        user `rating`. The voter's own rating is not changed.
      security:
        - tokenQuery: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Vote not found }

  /votes/user/{internal_user_id}/update-rating:
    get:
      tags: [prv]
      summary: Override a user's rating
      description: |
        Sets the user's `rating` and logs the change (`Admin rating override` with
        `internal_user_id`, `from`, `to`) to the app's stdout. The token is checked before
        the params, so a wrong token is a 401 whatever `rating` is.
      security:
        - tokenQuery: []
      parameters:
        - { name: internal_user_id, in: path, required: true, schema: { type: integer } }
        - { name: rating, in: query, required: true, schema: { type: integer } }
      responses:
        '201': { description: Updated }
        '400': { description: Missing or non-integer rating }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events:
    post:
      tags: [prv]
      summary: Submit a batch of events
      description: |
        Accepts a JSON array of mixed event objects. Each event must have a `type` field.
        Supported types: `interval_undo`, `interval_click`, `time_saved`, `client_failed`.
        Invalid events are logged to stdout and skipped — the rest of the batch is still processed.
        If the batch contains at least one `time_saved` event, `data.time_saved` is included in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                oneOf:
                  - { $ref: '#/components/schemas/EventIntervalUndo' }
                  - { $ref: '#/components/schemas/EventIntervalClick' }
                  - { $ref: '#/components/schemas/EventTimeSaved' }
                  - { $ref: '#/components/schemas/EventClientFailed' }
              example:
                - { type: interval_undo, user_id: "uuid-abc", video_native_id: "123_456", category_id: 1, start: 5, end: 30 }
                - { type: interval_click, user_id: "uuid-abc", video_native_id: "123_456", category_id: 1, start: 5, end: 30, click_time: 12 }
                - { type: time_saved, user_id: "uuid-abc", prv_user_id: 789, inc: 25 }
                - { type: client_failed, user_id: "uuid-abc", prv_user_id: 789, video_native_id: "123_456", reason: "segment_not_found", data: { attempts: 3 } }
      responses:
        '200':
          description: Events recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ── Admin ────────────────────────────────────────────────────────────────────
  /admin/video/{video_id}:
    get:
      tags: [Admin]
      summary: Admin dashboard — markups for a video
      security:
        - tokenQuery: []
      parameters:
        - { name: video_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: HTML dashboard page
          content:
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/video/{video_id}/ai/withdraw:
    get:
      tags: [Admin]
      summary: Withdraw the video's AI row (the operator's per-video switch)
      description: "Refuses every request when AUTH_TOKEN is unset. Sets withdrawn_by = admin; clients get the human segments again and no review verdict restores the row."
      security:
        - tokenQuery: []
      parameters:
        - { name: video_id, in: path, required: true, schema: { type: integer }, description: "videos.id" }
      responses:
        '200': { description: Withdrawn }
        '400': { description: Non-numeric video id }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No published AI row }

  /admin/video/{video_id}/user/{prv_user_id}:
    get:
      tags: [Admin]
      summary: Admin dashboard — markups by a specific user
      security:
        - tokenQuery: []
      parameters:
        - { name: video_id,    in: path, required: true, schema: { type: string } }
        - { name: prv_user_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: HTML dashboard page
          content:
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/markups/{id}/delete:
    get:
      tags: [Admin]
      summary: Delete a markup from the admin dashboard
      security:
        - tokenQuery: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '302': { description: Redirect back to video page }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/review:
    get:
      tags: [Admin]
      summary: Assessor review — reviewer picker, then the batch list with progress and state
      description: "Refuses every request when AUTH_TOKEN is unset. Without a registered `reviewer`: the picker with a create-reviewer form (JSON `{reviewers, reviewer: null}`, 400 for an unknown code). `decided`/`open` count the reviewer's own verdicts; `state` ∈ mine | available | locked | done | closed, and `closed` rows only come with show=all. `?lang=ru|en` sets the `review_lang` cookie (default ru)."
      security:
        - tokenQuery: []
      parameters:
        - { name: reviewer, in: query, required: false, schema: { type: string } }
        - { name: show,     in: query, required: false, schema: { type: string, enum: [all] } }
        - { name: lang,     in: query, required: false, schema: { type: string, enum: [ru, en] } }
        - { name: format,   in: query, required: false, schema: { type: string, enum: [json] } }
      responses:
        '200':
          description: "HTML page, or `{reviewer, batches: [{batch, total, decided, open, reviews_needed, finished, locked_by, locked_at, state}]}` with format=json"
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { type: object }
        '400': { description: Unknown reviewer (format=json) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/review/reviewers:
    post:
      tags: [Admin]
      summary: Assessor review — create a reviewer (the name is the code)
      description: "Refuses every request when AUTH_TOKEN is unset. Trimmed, NFC, inner spaces collapsed; 1–64 letters (any script), digits, space, `.`, `_`, `-`. A name taken in any letter case is refused. The picker form gets 303 to the new reviewer's batch list, or 400 with the picker and the reason."
      security:
        - tokenQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Reviewer created (JSON)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
        '303': { description: Created (form); redirect to the new reviewer's batch list }
        '400': { description: "`{reason: invalid | taken, message}` (JSON) or the picker with the reason (form)" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/review/{batch}/take:
    post:
      tags: [Admin]
      summary: Assessor review — take a batch (lock it on the reviewer)
      description: "Refuses every request when AUTH_TOKEN is unset. Only a batch available to the reviewer; of two concurrent takes exactly one wins. Taking a batch you already hold returns the lock."
      security:
        - tokenQuery: []
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewLockRequest' }
      responses:
        '200': { description: Locked, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewLock' } } } }
        '400': { description: Unknown reviewer or invalid force }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Batch not found }
        '409': { description: "Not available: `{reason: locked | done | closed, locked_by, message}`" }

  /admin/review/{batch}/release:
    post:
      tags: [Admin]
      summary: Assessor review — give up a batch, or force-release someone else's lock
      description: "Refuses every request when AUTH_TOKEN is unset. The holder clears their own lock; `force: true` clears anyone's. Verdicts stay."
      security:
        - tokenQuery: []
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewLockRequest' }
      responses:
        '200': { description: "Released (also when nobody held it)", content: { application/json: { schema: { $ref: '#/components/schemas/ReviewLock' } } } }
        '400': { description: Unknown reviewer or invalid force }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Batch not found }
        '409': { description: "Another reviewer holds it and force is not set: `{reason: locked, locked_by, message}`" }

  /admin/review/{batch}:
    get:
      tags: [Admin]
      summary: Assessor review — item page
      description: "Refuses every request when AUTH_TOKEN is unset. Needs a registered `reviewer` (HTML: 302 to the picker; JSON: 400). Without `item`: the reviewer's first open item by position, or the last item when they decided them all; open/decided and nav count the reviewer's own verdicts. `flagged_by` is present only once the item has a verdict. `item.player_link` is the stored sheet link, or null when it is not http(s); `item.own_verdict` is the reviewer's latest verdict or null; `item.kind` is `sheet` or `ai` (an entry of an AI row sent by the judge) and `item.video_id` the AI row's videos.id (null for sheet items); nav entries are `{item_code, decided, player_link}`. Verdicts carry `bounds: {start, end, source} | null`; `item.effective_bounds` = `{start, end, reviewer, source}` of the latest verdict with bounds, else the item's own (reviewer and source null); `item.own_bounds` = the bounds of the reviewer's own latest verdict or null. `transcript` (ai items with an AI row, else null) = `{from, to, has_words, cues: [{start, end, text, words?: [{t, text}]}]}`: the detector run's cues within `context` seconds of the item's own and effective bounds."
      security:
        - tokenQuery: []
      parameters:
        - { name: batch,    in: path,  required: true,  schema: { type: string } }
        - { name: reviewer, in: query, required: true,  schema: { type: string } }
        - { name: item,     in: query, required: false, schema: { type: string, example: C7 } }
        - { name: lang,     in: query, required: false, schema: { type: string, enum: [ru, en] } }
        - { name: format,   in: query, required: false, schema: { type: string, enum: [json] } }
        - { name: context,  in: query, required: false, schema: { type: integer, minimum: 0, maximum: 600, default: 60 }, description: "Seconds of transcript on each side of an ai item" }
      responses:
        '200':
          description: "HTML page, or `{reviewer, batch, can_decide, item, video_flags: {track_mismatch}, nav: {prev, next, first_open}, signals, transcript, context}` with format=json (`batch` = the reviewer's progress row, as in the list)"
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { type: object }
        '302': { description: No reviewer; redirect to the picker }
        '400': { description: "No reviewer (format=json), or `context` not an integer 0…600" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Batch or item not found }

  /admin/review/decide:
    post:
      tags: [Admin]
      summary: Assessor review — append a verdict
      description: "Refuses every request when AUTH_TOKEN is unset. Append-only; the latest verdict per item wins; a verdict identical to the reviewer's own latest one is not appended again. Only the batch holder, or a reviewer who has finished the batch, may decide; the verdict on the reviewer's last open item releases their lock. On an `ai` item an appended verdict is applied to the AI row in the same transaction: not_ad / unclear remove the entry (the row is withdrawn by review when none is left), sponsor / self_promotion keep it or put it back with that category, at `bounds` when given (the entry is replaced: `source: review`, rating from the votes on the new bounds; bounds overlapping another entry → 400). The entry an item refers to sits at the item's effective bounds (its latest verdict with bounds, else its own). A row withdrawn by the judge or by review is served again once every entry's latest verdict, decided after the withdraw, keeps it."
      security:
        - tokenQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id, verdict, reviewer]
              properties:
                item_id:  { type: integer, minimum: 1, maximum: 2147483647, description: "JSON integer; strings are rejected" }
                verdict:  { type: string, enum: [sponsor, self_promotion, not_ad, unclear] }
                comment:  { type: string, nullable: true, description: "Trimmed; blank or null → no comment" }
                reviewer: { type: string, description: "A registered reviewer code" }
                track_mismatch: { type: boolean, description: "Video flag: subtitle track does not match the player; saved only when it changes" }
                bounds:
                  type: object
                  nullable: true
                  description: "Optional, keep verdicts only (else 400): the segment's real start and end, whole seconds (`0 ≤ start < end ≤ 86400`, at least 5 s). Part of the duplicate check."
                  required: [start, end, source]
                  properties:
                    start:  { oneOf: [{ type: integer }, { type: string, example: "1:05" }], description: "Seconds, or `m:ss` / `h:mm:ss`" }
                    end:    { oneOf: [{ type: integer }, { type: string, example: "1:42" }] }
                    source: { type: string, enum: [cue, typed], description: "A transcript selection or typed times" }
      responses:
        '201':
          description: Verdict recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  item_id:    { type: integer }
                  item_code:  { type: string }
                  verdict:    { type: string, description: "The item's latest verdict" }
                  bounds:     { type: object, nullable: true, description: "`{start, end, source}` of the item's latest verdict, or null" }
                  effective_bounds: { type: object, description: "`{start, end, reviewer, source}`: the bounds the item now refers to" }
                  track_mismatch: { type: boolean }
                  flagged_by: { type: array, items: { type: string } }
                  next_item:  { type: string, nullable: true, description: "The reviewer's next open item after this one, wrapping round; null when they are done" }
                  next_player_link: { type: string, nullable: true }
                  ai_applied: { type: boolean, description: "The AI row changed (ai items only; false otherwise)" }
        '400': { description: "Invalid verdict, reviewer, comment, track_mismatch, bounds (bad, on a non-keep verdict, overlapping another AI entry; text in the page language) or unknown item" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: "The reviewer neither holds nor has finished the batch: `{reason: available | locked | closed, locked_by, message}`" }

  # ── RT ──────────────────────────────────────────────────────────────────────
  /rt/video-calculated:
    get:
      tags: [RT]
      summary: Get calculated segments
      parameters:
        - { name: video_id,  in: query, required: true,  schema: { type: string } }
        - { name: duration,  in: query, required: true,  schema: { type: integer } }
        - { name: user_id,   in: query, required: false, schema: { type: string } }
        - { name: prv_user_id,in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Calculated segments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Segment' }
        '204': { description: No data }

  /rt/markup:
    post:
      tags: [RT]
      summary: Submit a markup
      description: |
        Users with rating ≤ −2 are silently accepted (201 returned) but the markup is not stored.
        The markup and all its intervals are stored in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RTMarkupBody' }
      responses:
        '201': { description: Created }
        '400': { description: "Validation error, e.g. `data.intervals` empty or over 20 items, a missing or non-numeric `start`/`end`, or an interval outside `0 <= start < end <= 86400` after rounding" }

  /rt/markups:
    get:
      tags: [RT]
      summary: List markups
      security:
        - basicAuth: []
      responses:
        '200':
          description: Markups list
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [RT]
      summary: Update a markup interval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RTUpdateMarkupBody' }
      responses:
        '200': { description: Updated }
        '400': { description: "New category is invalid, or the resulting interval breaks the POST /markup rules (0 <= start < end <= 86400)" }
        '404': { $ref: '#/components/responses/NotFound' }

  /rt/markups/{id}:
    delete:
      tags: [RT]
      summary: Soft-delete a markup
      security:
        - basicAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rt/markups/{id}/delete:
    get:
      tags: [RT]
      summary: Soft-delete a markup (Grafana-compatible)
      security:
        - tokenQuery: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rt/videos/{id}/markups:
    delete:
      tags: [RT]
      summary: Hard-delete all markups for a video
      security:
        - basicAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rt/vote:
    post:
      tags: [RT]
      summary: Submit a vote on a calculated segment
      description: |
        Replaces the user's previous vote on the segment (the same value again changes nothing)
        and recomputes the segment's
        `rating` (in `rt_calculated_segments` and the matching `rt_video_calculateds.data` entry,
        omitted there when 0) from the votes table: the sum of each user's latest vote on the
        exact `(category_id, start, end)`. Also adjusts by the diff between the new and the
        previous vote the user `rating` of every author whose markup has an interval with
        the exact `(start, end)`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RTVoteBody' }
      responses:
        '204': { description: Vote recorded }
        '404': { description: Video, calculated data, or segment not found }

  /rt/votes/{id}/delete:
    get:
      tags: [RT]
      summary: Delete a vote (Grafana-compatible)
      description: |
        Undoes the vote: deletes it, recomputes the segment's `rating` from the remaining
        votes (`rt_calculated_segments` and `rt_video_calculateds.data`) and reverses the change the vote
        made to the markup authors' user `rating`. The voter's own rating is not changed.
      security:
        - tokenQuery: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Vote not found }

  /rt/votes/user/{internal_user_id}/update-rating:
    get:
      tags: [RT]
      summary: Override a user's rating
      description: |
        Sets the user's `rating` and logs the change (`Admin rating override` with
        `internal_user_id`, `from`, `to`) to the app's stdout. The token is checked before
        the params, so a wrong token is a 401 whatever `rating` is.
      security:
        - tokenQuery: []
      parameters:
        - { name: internal_user_id, in: path, required: true, schema: { type: integer } }
        - { name: rating, in: query, required: true, schema: { type: integer } }
      responses:
        '201': { description: Updated }
        '400': { description: Missing or non-integer rating }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rt/events:
    post:
      tags: [RT]
      summary: Submit a batch of events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                oneOf:
                  - { $ref: '#/components/schemas/EventIntervalUndo' }
                  - { $ref: '#/components/schemas/EventIntervalClick' }
                  - { $ref: '#/components/schemas/EventTimeSaved' }
                  - { $ref: '#/components/schemas/EventClientFailed' }
      responses:
        '200':
          description: Events recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

