name: Build and Run Docker Image on Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 20   # matches node:20-bookworm-slim in the Dockerfile
        cache: yarn

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'   # matches golang:1.27-bookworm in the Dockerfile
        cache: false   # deps are vendored

    - name: Install Node dependencies
      run: yarn install --frozen-lockfile

    - name: Node unit tests
      run: make test-unit

    - name: Go unit tests
      run: go test -mod=vendor ./calculator

    - name: E2E tests (Docker)
      run: make test-e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup SSH
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST_IP: ${{ secrets.HOST_IP }}
      run: |
        mkdir -p ~/.ssh/
        chmod 700 ~/.ssh
        echo "$PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Pinned host key of the prod VM (public, not a secret). A rebuilt VM gets a
        # new key: replace it here (ssh-keygen -F <ip> on a machine that trusts it).
        echo "$HOST_IP ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9SvsKQeM8YyA0/Az6Gsa8eI3XpxlMYxz0LmKlcsCs5" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        printf 'Host *\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Transfer Codebase to Timeweb
      run: |
        tar czf - --exclude=.git --exclude=node_modules . | ssh skipper-admin@${{ secrets.HOST_IP }} "cat > /home/skipper-admin/tmp/codebase.tar.gz"

    - name: Deploy to Timeweb
      env:
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        NODE_APP_PORT: ${{ secrets.NODE_APP_PORT }}
        AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        HOST_IP: ${{ secrets.HOST_IP }}
        IMAGE_NAME: native-ad-skip-api
      # The remote script goes over stdin to 'bash -s', so no secret is on any
      # command line (ps on the host, or here: printf is a bash builtin), and
      # printf %q quotes each value safely whatever characters it contains.
      # Commands in the script get < /dev/null so they cannot read the rest of
      # the script from stdin.
      run: |
        {
          # Переменные окружения
          printf 'export %s=%q\n' \
            DB_NAME "$DB_NAME" \
            DB_USER "$DB_USER" \
            DB_PASSWORD "$DB_PASSWORD" \
            NODE_APP_PORT "$NODE_APP_PORT" \
            AUTH_TOKEN "$AUTH_TOKEN" \
            GF_ADMIN_PASSWORD "$GF_ADMIN_PASSWORD" \
            TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID" \
            HOST_IP "$HOST_IP" \
            IMAGE_NAME "$IMAGE_NAME"
          cat <<'EOF'
        set -e

        # Перенос и распаковка исходного кода
        cd /home/skipper-admin/tmp
        tar xzf codebase.tar.gz < /dev/null

        # Сборка и запуск с использованием Docker Compose v2. No 'down': 'up --build'
        # builds the image first and touches containers only if the build succeeded,
        # so the old stack keeps serving during the build and after a failed one.
        # --force-recreate restarts prometheus/grafana too, as 'down' did, so they
        # pick up the re-extracted bind-mounted configs.
        docker compose -p "$IMAGE_NAME" -f /home/skipper-admin/tmp/docker-compose.yml up --build -d --force-recreate --remove-orphans app prometheus grafana < /dev/null

        # Очистка
        rm -rf /home/skipper-admin/tmp/codebase.tar.gz
        EOF
        } | ssh skipper-admin@"$HOST_IP" 'bash -s'
