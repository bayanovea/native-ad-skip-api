name: Build and Run Docker Image on Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: deploy this image tag (a commit sha already in GHCR) instead of building one'
        required: false
        type: string
        default: ''

env:
  IMAGE: ghcr.io/odedohbest/native-ad-skip-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 20   # matches node:20-bookworm-slim in the Dockerfile
        cache: yarn

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'   # matches golang:1.27-bookworm in the Dockerfile
        cache: false   # deps are vendored

    - name: Install Node dependencies
      run: yarn install --frozen-lockfile

    - name: Node unit tests
      run: make test-unit

    - name: Go unit tests
      run: go test -mod=vendor ./calculator ./ai/...

    - name: E2E tests (Docker)
      run: make test-e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to GHCR; the same job token pulls it on the host
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      # An image_tag input (rollback) deploys that tag without building; a push deploys the commit's image.
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Log in to GHCR
      if: ${{ !inputs.image_tag }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      if: ${{ !inputs.image_tag }}
      uses: docker/setup-buildx-action@v4

    - name: Build and push the image
      if: ${{ !inputs.image_tag }}
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ github.sha }}
          ${{ env.IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Setup SSH
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST_IP: ${{ secrets.HOST_IP }}
      run: |
        mkdir -p ~/.ssh/
        chmod 700 ~/.ssh
        echo "$PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Pinned host key of the prod VM (public, not a secret). A rebuilt VM gets a
        # new key: replace it here (ssh-keygen -F <ip> on a machine that trusts it).
        echo "$HOST_IP ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9SvsKQeM8YyA0/Az6Gsa8eI3XpxlMYxz0LmKlcsCs5" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        printf 'Host *\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
        chmod 600 ~/.ssh/config

    # The host still needs the checkout: prometheus/grafana configs are bind-mounted from it.
    - name: Transfer Codebase to Timeweb
      run: |
        tar czf - --exclude=.git --exclude=node_modules . | ssh skipper-admin@${{ secrets.HOST_IP }} "cat > /home/skipper-admin/tmp/codebase.tar.gz"

    - name: Deploy to Timeweb
      env:
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        NODE_APP_PORT: ${{ secrets.NODE_APP_PORT }}
        AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # AI switches: repository variables; unset is empty, which docker-compose.yml turns into off / the code default.
        AI_FIRST: ${{ vars.AI_FIRST }}
        AI_DETECT_ENABLED: ${{ vars.AI_DETECT_ENABLED }}
        AI_JUDGE_ENABLED: ${{ vars.AI_JUDGE_ENABLED }}
        AI_JUDGE_AUTO_WITHDRAW: ${{ vars.AI_JUDGE_AUTO_WITHDRAW }}
        AI_JUDGE_MODEL: ${{ vars.AI_JUDGE_MODEL }}
        AI_JUDGE_MIN_INTERVAL: ${{ vars.AI_JUDGE_MIN_INTERVAL }}
        AI_MIN_VIEWS: ${{ vars.AI_MIN_VIEWS }}
        AI_MIN_REQUESTS: ${{ vars.AI_MIN_REQUESTS }}
        AI_DAILY_BUDGET_VIDEOS: ${{ vars.AI_DAILY_BUDGET_VIDEOS }}
        AI_MIN_SEGMENT_SECONDS: ${{ vars.AI_MIN_SEGMENT_SECONDS }}
        HOST_IP: ${{ secrets.HOST_IP }}
        IMAGE_NAME: native-ad-skip-api
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # job token: can pull this repo's package, expires with the job
      # The remote script goes over stdin to 'bash -s', so no secret is on any
      # command line (ps on the host, or here: printf is a bash builtin), and
      # printf %q quotes each value safely whatever characters it contains.
      # Commands in the script get < /dev/null so they cannot read the rest of
      # the script from stdin.
      run: |
        {
          # Переменные окружения
          printf 'export %s=%q\n' \
            DB_NAME "$DB_NAME" \
            DB_USER "$DB_USER" \
            DB_PASSWORD "$DB_PASSWORD" \
            NODE_APP_PORT "$NODE_APP_PORT" \
            AUTH_TOKEN "$AUTH_TOKEN" \
            GF_ADMIN_PASSWORD "$GF_ADMIN_PASSWORD" \
            TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID" \
            ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" \
            AI_FIRST "$AI_FIRST" \
            AI_DETECT_ENABLED "$AI_DETECT_ENABLED" \
            AI_JUDGE_ENABLED "$AI_JUDGE_ENABLED" \
            AI_JUDGE_AUTO_WITHDRAW "$AI_JUDGE_AUTO_WITHDRAW" \
            AI_JUDGE_MODEL "$AI_JUDGE_MODEL" \
            AI_JUDGE_MIN_INTERVAL "$AI_JUDGE_MIN_INTERVAL" \
            AI_MIN_VIEWS "$AI_MIN_VIEWS" \
            AI_MIN_REQUESTS "$AI_MIN_REQUESTS" \
            AI_DAILY_BUDGET_VIDEOS "$AI_DAILY_BUDGET_VIDEOS" \
            AI_MIN_SEGMENT_SECONDS "$AI_MIN_SEGMENT_SECONDS" \
            HOST_IP "$HOST_IP" \
            IMAGE_NAME "$IMAGE_NAME" \
            IMAGE "$IMAGE" \
            IMAGE_TAG "$IMAGE_TAG" \
            GHCR_USER "$GHCR_USER" \
            GHCR_TOKEN "$GHCR_TOKEN"
          cat <<'EOF'
        set -e

        # Распаковка исходного кода в свежий каталог src/ (не поверх старого, чтобы
        # удалённые из репозитория файлы не оставались на хосте); предыдущий — в src.old/.
        cd /home/skipper-admin/tmp
        rm -rf src.new
        mkdir src.new
        tar xzf codebase.tar.gz -C src.new < /dev/null
        rm -rf src.old
        if [ -d src ]; then mv src src.old; fi
        mv src.new src
        rm -f codebase.tar.gz

        # Образ собран в CI и лежит в GHCR; хост только скачивает его. The pipe gives
        # login its own stdin, so it cannot read the rest of this script. Logout runs
        # whatever happens after it (set -e), so the job token never stays on the host.
        printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
        trap 'docker logout ghcr.io' EXIT
        docker compose -p "$IMAGE_NAME" -f /home/skipper-admin/tmp/src/docker-compose.yml pull app < /dev/null

        # Запуск с использованием Docker Compose v2. No 'down': the old stack keeps
        # serving until the pulled image is up, and stays up if the pull failed. --no-build
        # because the service also has 'build:' (for local runs): without it, a missing
        # image would be built on the host. --force-recreate restarts the monitoring services
        # too, so they pick up the re-extracted bind-mounted configs; up pulls the exporters' images
        # when missing.
        docker compose -p "$IMAGE_NAME" -f /home/skipper-admin/tmp/src/docker-compose.yml up -d --no-build --force-recreate --remove-orphans app prometheus grafana node-exporter blackbox-exporter < /dev/null

        # Old app images: keep the KEEP_IMAGES newest and the running one; a failed rm never fails the deploy.
        # The by-hand rollback (CLAUDE.md → Rollback) needs the image in the local cache; older shas go
        # through the workflow rollback, which pulls.
        KEEP_IMAGES=5
        kept=; removed=; failed=; n=0
        for row in $(docker image ls "$IMAGE" --format '{{.CreatedAt}}|{{.Tag}}|{{.ID}}' < /dev/null | sort -r | cut -d'|' -f2,3); do
          tag=${row%|*}
          if [ "$tag" = "<none>" ]; then
            ref=${row#*|}
          elif [ "$tag" = "$IMAGE_TAG" ] || [ "$n" -lt "$KEEP_IMAGES" ]; then
            n=$((n + 1)); kept="$kept $tag"; continue
          else
            ref=$IMAGE:$tag
          fi
          if docker image rm "$ref" > /dev/null 2>&1 < /dev/null; then removed="$removed ${ref#"$IMAGE":}"; else failed="$failed ${ref#"$IMAGE":}"; fi
        done
        echo "Image cleanup: kept${kept:- none}"
        echo "Image cleanup: removed${removed:- none}${failed:+; not removed (in use?):$failed}"
        EOF
        } | ssh skipper-admin@"$HOST_IP" 'bash -s'
