name: Build and Run Docker Image on DO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup SSH
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh/
        echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

    - name: Transfer Codebase to DO
      run: |
        tar czf - . | ssh -o StrictHostKeyChecking=no root@${{ secrets.HOST_IP }} "cat > /tmp/codebase.tar.gz"

    - name: Deploy to DO
      env:
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: database
        NODE_APP_PORT: ${{ secrets.NODE_APP_PORT }}
        AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        HOST_IP: ${{ secrets.HOST_IP }}
        IMAGE_NAME: native-ad-skip-api
      run: |
        ssh -o StrictHostKeyChecking=no root@$HOST_IP "
        # Остановка и удаление существующих контейнеров и образов
        CONTAINER_ID=\$(docker ps -aq --filter 'ancestor=$IMAGE_NAME-app-1')
        if [ ! -z '\$CONTAINER_ID' ]; then 
          docker stop \$CONTAINER_ID
          docker rm \$CONTAINER_ID
        fi
        
        # Перенос и распаковка исходного кода
        cd /tmp
        tar xzf codebase.tar.gz
        
        # Сборка и запуск с использованием Docker Compose
        docker-compose -p $IMAGE_NAME -f /tmp/docker-compose.yml up --build -d 
          # --scale app=2
        
        # Очистка
        rm -rf /tmp/codebase.tar.gz"
