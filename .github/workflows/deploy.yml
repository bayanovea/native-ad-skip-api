name: Build and Run Docker Image on DO

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup SSH
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh/
        echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

    - name: Deploy to DO
      run: |
        tar czf - . | ssh -o StrictHostKeyChecking=no root@167.172.32.24 "docker build -t native-ad-skip-api - && docker run -d native-ad-skip-api"
