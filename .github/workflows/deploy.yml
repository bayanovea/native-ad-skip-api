name: Build and Run Docker Image on DO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup SSH
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh/
        echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

    - name: Transfer Codebase to DO
      run: |
        tar czf - . | ssh -o StrictHostKeyChecking=no root@134.122.73.229 "cat > /tmp/codebase.tar.gz"

    - name: Deploy to DO
      env:
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        NODE_APP_PORT: ${{ secrets.NODE_APP_PORT }}
        AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        IMAGE_NAME: vk-ad-skip-api
      run: ssh -o StrictHostKeyChecking=no root@134.122.73.229 "CONTAINER_ID=\$(docker ps -aq --filter 'ancestor=$IMAGE_NAME'); if [ ! -z '\$CONTAINER_ID' ]; then docker stop \$CONTAINER_ID; fi; cd /tmp; tar xzf codebase.tar.gz; docker build -t $IMAGE_NAME .; docker run -p 3022:3022 --network='host' -e DB_NAME='$DB_NAME' -e DB_USER='$DB_USER' -e DB_PASSWORD='$DB_PASSWORD' -e DB_HOST='$DB_HOST' -e NODE_APP_PORT='$NODE_APP_PORT' -e AUTH_TOKEN='$AUTH_TOKEN' -d $IMAGE_NAME 1>> /var/www/logs/vk-ad-skip-api/$(date +%Y-%m-%d).log 2>> /var/www/logs/vk-ad-skip-api/$(date +%Y-%m-%d)-errors.log; rm -rf /tmp/codebase.tar.gz;"
