name: Build and Run Docker Image on DO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup SSH
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        NODE_APP_PORT: ${{ secrets.NODE_APP_PORT }}
      run: |
        mkdir -p ~/.ssh/
        echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

    - name: Deploy to DO
      run: |
        tar czf - . | ssh -o StrictHostKeyChecking=no root@167.172.32.24 "docker build -t vk-ad-skip-api - && docker run --network="host" -d vk-ad-skip-api"
