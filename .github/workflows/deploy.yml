name: Build and Run Docker Image on Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh/
        echo "$PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Transfer Codebase to Timeweb
      run: |
        tar czf - . | ssh -o StrictHostKeyChecking=no skipper-admin@${{ secrets.HOST_IP }} "cat > /home/skipper-admin/tmp/codebase.tar.gz"

    - name: Deploy to Timeweb
      env:
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        NODE_APP_PORT: ${{ secrets.NODE_APP_PORT }}
        AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
        HOST_IP: ${{ secrets.HOST_IP }}
        IMAGE_NAME: native-ad-skip-api
      run: |
        ssh -o StrictHostKeyChecking=no skipper-admin@$HOST_IP "
        # Перенос и распаковка исходного кода
        cd /home/skipper-admin/tmp
        tar xzf codebase.tar.gz

        # Переменные окружения
        export DB_NAME='$DB_NAME'
        export DB_USER='$DB_USER'
        export DB_PASSWORD='$DB_PASSWORD'
        export NODE_APP_PORT='$NODE_APP_PORT'
        export AUTH_TOKEN='$AUTH_TOKEN'
        export GF_ADMIN_PASSWORD='$GF_ADMIN_PASSWORD'
        export HOST_IP='$HOST_IP'

        # Сборка и запуск с использованием Docker Compose v2
        docker compose -p $IMAGE_NAME -f /home/skipper-admin/tmp/docker-compose.yml down
        docker compose -p $IMAGE_NAME -f /home/skipper-admin/tmp/docker-compose.yml up --build -d app prometheus grafana

        # Очистка
        rm -rf /home/skipper-admin/tmp/codebase.tar.gz"
